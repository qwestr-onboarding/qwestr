# Временный конфиг — используется только если nginx нужно запустить до получения сертификатов
# После получения wildcard-сертификата: удали этот файл и запусти: nginx -s reload
server {
    listen 80;
    server_name _;

    location / {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
