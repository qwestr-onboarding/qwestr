# HTTP → HTTPS redirect (все поддомены)
server {
    listen 80;
    server_name *.qwestr.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

# API — api.qwestr.ru (exact match, приоритет над wildcard)
server {
    listen 443 ssl;
    http2 on;
    server_name api.qwestr.ru;

    ssl_certificate     /etc/letsencrypt/live/qwestr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwestr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # SignalR WebSocket (notifications hub)
    location /hubs/ {
        proxy_pass         http://qwestr-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass         http://qwestr-api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Frontend — все остальные поддомены *.qwestr.ru (тенанты + app)
server {
    listen 443 ssl;
    http2 on;
    server_name *.qwestr.ru;

    ssl_certificate     /etc/letsencrypt/live/qwestr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwestr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Blazor Server WebSocket
    location /_blazor {
        proxy_pass         http://qwestr-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass         http://qwestr-web:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
