# HTTP → HTTPS redirect (все поддомены)
server {
    listen 80;
    server_name *.qwestr.ru;

    location / {
        return 301 https://$host$request_uri;
    }
}

# Общие SSL-параметры (вынесены в переменные через map-блок выше быть не может,
# поэтому дублируются в каждом server — зато нет зависимости от certbot-файлов)

# API — api.qwestr.ru (exact match, приоритет над wildcard)
server {
    listen 443 ssl;
    http2 on;
    server_name api.qwestr.ru;

    ssl_certificate      /etc/letsencrypt/live/qwestr/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/qwestr/privkey.pem;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    client_max_body_size 50m;

    # SignalR WebSocket (notifications hub)
    location /hubs/ {
        proxy_pass         http://qwestr-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass         http://qwestr-api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Frontend — все остальные поддомены *.qwestr.ru (тенанты + app)
server {
    listen 443 ssl;
    http2 on;
    server_name *.qwestr.ru;

    ssl_certificate      /etc/letsencrypt/live/qwestr/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/qwestr/privkey.pem;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    client_max_body_size 50m;

    # Blazor Server WebSocket
    location /_blazor {
        proxy_pass         http://qwestr-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass         http://qwestr-web:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
